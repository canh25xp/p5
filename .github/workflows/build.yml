name: build

on:
  push:
    branches:
      - main
      - 'release-[0-9]+.[0-9]+'
    paths:
      - '**.cmake'
      - '**/CMakeLists.txt'
      - '**/CMakePresets.json'
      - 'cmake/**'
      - '.github/**'
      - 'source/**'
      - 'include/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libssl-dev libzstd-dev

      - name: Build Debug
        run: cmake --workflow ninja-debug

      - name: Build Release
        run: cmake --workflow ninja-release

      - name: Test binary
        run: |
          ./build/Debug/p5 --version
          ./build/Release/p5 --version

  build-windows:
    name: Build (Windows)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Debug and Release
        run: cmake --workflow msvc2022

      - name: Test binary
        run: |
          ./build/Debug/p5.exe --version
          ./build/Release/p5.exe --version
        shell: pwsh
