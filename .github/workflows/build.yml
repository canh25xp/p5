name: build

on:
  push:
    branches:
      - main
      - "release-[0-9]+.[0-9]+"
    paths:
      - "**.cmake"
      - "**/CMakeLists.txt"
      - "**/CMakePresets.json"
      - "cmake/**"
      - ".github/**"
      - "source/**"
      - "include/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libssl-dev libzstd-dev

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .cache/download
          key: ${{ runner.os }}-p5-deps-${{ hashFiles('cmake/downloadP4api.cmake', 'cmake/downloadOpensslWindows.cmake') }}
          restore-keys: |
            ${{ runner.os }}-p5-deps-

      - name: Build
        run: |
          cmake --workflow ninja-debug
          cmake --workflow ninja-release
        env:
          P5_BINARY_CACHE: ${{ github.workspace }}/.cache/download

      - name: Test binary
        run: |
          ./build/Debug/p5 --version
          ./build/Release/p5 --version

      - name: Pack artifacts
        run: |
          mkdir -p out
          zip -j "out/p5-linux-x64-Debug.zip" build/Debug/p5
          zip -j "out/p5-linux-x64-Release.zip" build/Release/p5
          ls -la out

      - name: Upload dist (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: out

  build-windows:
    name: Build (Windows)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .cache/download
          key: ${{ runner.os }}-p5-deps-${{ hashFiles('cmake/downloadP4api.cmake', 'cmake/downloadOpensslWindows.cmake') }}
          restore-keys: |
            ${{ runner.os }}-p5-deps-

      - name: Build
        run: |
          cmake --workflow msvc2022
        env:
          P5_BINARY_CACHE: ${{ github.workspace }}/.cache/download

      - name: Test binary
        run: |
          ./build/Debug/p5.exe --version
          ./build/Release/p5.exe --version
        shell: pwsh

      - name: Pack artifacts
        run: |
          $out = "out"
          New-Item -ItemType Directory -Force -Path $out
          $rels = @(
            @{ path = "build\Debug\p5.exe";  zip = "p5-windows-x64-Debug.zip" },
            @{ path = "build\Release\p5.exe"; zip = "p5-windows-x64-Release.zip" }
          )
          foreach ($r in $rels) {
            if (-not (Test-Path $r.path)) { throw "Missing: $($r.path)" }
            Compress-Archive -Path $r.path -DestinationPath (Join-Path $out $r.zip) -Force
          }
        shell: pwsh

      - name: Upload dist (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: out
