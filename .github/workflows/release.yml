name: release

on:
  schedule:
    - cron: "5 5 * * *"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release"
        required: false
        default: nightly
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.build.outputs.build_type }}
      tag_name: ${{ steps.build.outputs.tag_name }}
    steps:
      - name: Determine tag
        id: build
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "schedule" ]; then
            TAG_NAME="nightly"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

  build-linux:
    needs: setup
    runs-on: ubuntu-22.04
    env:
      TAG_NAME: ${{ needs.setup.outputs.tag_name }}
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            build
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt', '**/cmake/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cmake-

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libssl-dev libzstd-dev

      - name: Build
        run: |
          set -euo pipefail
          cmake --workflow ninja-release

      - name: Pack artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          zip -j "out/p5-${TAG_NAME}-linux-x64.zip" build/Release/p5
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p5-linux-x64
          path: out
          retention-days: 1

      - name: Export version
        id: build
        run: |
          set -euo pipefail
          VERSION=$(./build/Release/p5 --version | head -n1 | tr -d '\n')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-windows:
    needs: setup
    runs-on: windows-2022
    env:
      TAG_NAME: ${{ needs.setup.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache
            build
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt', '**/cmake/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cmake-

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: |
          cmake --preset msvc2022
          cmake --build --preset msvc2022-release

      - name: Pack artifacts
        run: |
          $out = "out"
          New-Item -ItemType Directory -Force -Path $out
          $zipName = "p5-${env:TAG_NAME}-windows-x64.zip"
          Compress-Archive -Path "build\Release\p5.exe" -DestinationPath (Join-Path $out $zipName) -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p5-windows-x64
          path: out
          retention-days: 1

  publish:
    needs: [setup, build-linux, build-windows]
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: p5-linux-x64
          path: assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: p5-windows-x64
          path: assets

      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd assets && sha256sum *.zip > SHASUMS256.txt)
          head -n 20 assets/SHASUMS256.txt

      - name: Setup release variables
        run: |
          set -euo pipefail
          TAG_NAME="${{ needs.setup.outputs.tag_name }}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          if [ "$TAG_NAME" = "nightly" ]; then
            echo 'SUBJECT=p5 development (prerelease) build' >> $GITHUB_ENV
            echo 'PRERELEASE=--prerelease' >> $GITHUB_ENV
          else
            echo 'SUBJECT=p5 release build' >> $GITHUB_ENV
            echo 'PRERELEASE=' >> $GITHUB_ENV
          fi

      - name: Delete existing nightly release
        if: env.TAG_NAME == 'nightly'
        run: |
          set -euo pipefail
          gh release delete nightly --yes || true
          git push origin :refs/tags/nightly || true

      - name: Create release
        env:
          P5_VERSION: ${{ needs.build-linux.outputs.version }}
          P5_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          envsubst < "$GITHUB_WORKSPACE/.github/workflows/notes.md" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG_NAME" $PRERELEASE \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --title "$SUBJECT" \
            --target "$GITHUB_SHA" \
            assets/*
