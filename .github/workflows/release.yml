name: release

on:
  schedule:
    - cron: "5 5 * * *"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release"
        required: false
        default: nightly
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.build.outputs.build_type }}
      tag_name: ${{ steps.build.outputs.tag_name }}
    steps:
      - if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != 'nightly')
        run: |
          echo 'CMAKE_BUILD_TYPE=Release' >> $GITHUB_ENV
          echo 'TAG_NAME=${{ github.ref_name }}' >> $GITHUB_ENV
      - if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name == 'nightly')
        run: |
          echo 'CMAKE_BUILD_TYPE=RelWithDebInfo' >> $GITHUB_ENV
          echo 'TAG_NAME=nightly' >> $GITHUB_ENV
      - name: Export build information
        id: build
        run: |
          printf "build_type=${CMAKE_BUILD_TYPE}\n" >> $GITHUB_OUTPUT
          printf "tag_name=${TAG_NAME}\n" >> $GITHUB_OUTPUT

  build-linux:
    needs: setup
    runs-on: ubuntu-22.04
    env:
      CMAKE_BUILD_TYPE: ${{ needs.setup.outputs.build_type }}
      TAG_NAME: ${{ needs.setup.outputs.tag_name }}
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libssl-dev libzstd-dev

      - name: Build
        run: |
          cmake --workflow ninja-release

      - name: Pack artifacts
        run: |
          mkdir -p out
          zip -j "out/p5-linux-x64-release.zip" build/Release/p5
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p5-linux-x64
          path: out
          retention-days: 1

      - name: Export version
        id: build
        run: |
          printf 'version<<END\n' >> $GITHUB_OUTPUT
          ./build/Release/p5 --version 2>/dev/null || echo "p5 ${TAG_NAME}" >> $GITHUB_OUTPUT
          printf 'END\n' >> $GITHUB_OUTPUT

  build-windows:
    needs: setup
    runs-on: windows-2022
    env:
      CMAKE_BUILD_TYPE: ${{ needs.setup.outputs.build_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: |
          cmake --preset msvc2022
          cmake --build --preset msvc2022-release

      - name: Pack artifacts
        run: |
          $out = "out"
          New-Item -ItemType Directory -Force -Path $out
          Compress-Archive -Path "build\Release\p5.exe" -DestinationPath (Join-Path $out "p5-windows-x64-release.zip") -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p5-windows-x64
          path: out
          retention-days: 1

  publish:
    needs: [setup, build-linux, build-windows]
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: p5-linux-x64
          path: assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: p5-windows-x64
          path: assets

      - name: Generate checksums
        run: |
          (cd assets && sha256sum *.zip > SHASUMS256.txt)
          head -n 20 assets/SHASUMS256.txt

      - name: Setup release variables
        run: |
          TAG_NAME="${{ needs.setup.outputs.tag_name }}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          if [ "$TAG_NAME" = "nightly" ]; then
            echo 'SUBJECT=p5 development (prerelease) build' >> $GITHUB_ENV
            echo 'PRERELEASE=--prerelease' >> $GITHUB_ENV
          else
            echo 'SUBJECT=p5 release build' >> $GITHUB_ENV
            echo 'PRERELEASE=' >> $GITHUB_ENV
          fi

      - name: Delete existing nightly release
        if: env.TAG_NAME == 'nightly'
        run: |
          gh release delete nightly --yes || true
          git push origin :refs/tags/nightly || true

      - name: Delete existing stable release
        if: env.TAG_NAME != 'nightly'
        run: |
          gh release delete stable --yes || true
          git push origin :refs/tags/stable || true

      - name: Create release
        env:
          P5_VERSION: ${{ needs.build-linux.outputs.version }}
          P5_COMMIT: ${{ github.sha }}
        run: |
          envsubst < "$GITHUB_WORKSPACE/.github/workflows/notes.md" > "$RUNNER_TEMP/notes.md"
          if [ "$TAG_NAME" != "nightly" ]; then
            gh release create stable $PRERELEASE --notes-file "$RUNNER_TEMP/notes.md" --title "$SUBJECT" --target $GITHUB_SHA assets/*
          fi
          gh release create $TAG_NAME $PRERELEASE --notes-file "$RUNNER_TEMP/notes.md" --title "$SUBJECT" --target $GITHUB_SHA assets/*
